name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sintaxis del servidor y del front
        run: |
          node --check server.js
          node --check src/app.js
          for f in public/js/*.js; do node --check "$f"; done
      - name: Pruebas
        run: npm test
