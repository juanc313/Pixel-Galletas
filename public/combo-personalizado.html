<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combo personalizado — Pixel Galletas</title>
  <meta name="description" content="Arma tu combo Pixel Special Edition: elige cuántas Special y cuántas galletas normales llevas, y el sabor de cada una.">
  <meta name="theme-color" content="#15094F">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/fuentes.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="contenedor">
    <p><a class="volver-combos" href="/#combos">← Volver a los combos</a></p>
    <div class="calculadora-combos" id="calculadora-combos">
      <h1>Combo personalizado</h1>
      <p class="subtitulo">Elige cuántas Special y cuántas galletas normales llevas. El precio se calcula solo.</p>
      <div class="calc-contadores">
        <label>Special Edition
          <input id="calc-especiales" type="number" min="0" max="30" value="1" inputmode="numeric">
        </label>
        <label>Normales
          <input id="calc-normales" type="number" min="0" max="30" value="2" inputmode="numeric">
        </label>
      </div>
      <div class="calc-marcador" id="calc-marcador" aria-hidden="true"></div>
      <p class="calc-resultado" aria-live="polite" id="calc-resultado"></p>
      <p class="calc-detalle" id="calc-detalle"></p>
      <table class="calc-tabla" aria-label="Precio por cantidad de combos">
        <thead><tr><th>Combo</th><th>Galletas</th><th>Total</th><th>Por galleta</th></tr></thead>
        <tbody id="calc-tabla-cuerpo"></tbody>
      </table>
      <div class="armador-combo" id="armador-combo" hidden>
        <h4>Arma tu combo</h4>
        <p class="subtitulo">Elige el sabor de cada galleta normal.</p>
        <div id="armador-sabores"></div>
        <p class="calc-resultado" id="armador-total" aria-live="polite"></p>
        <button type="button" id="btn-armador-agregar">Agregar combo al carrito</button>
      </div>
    </div>
    <p><a href="/#pedido">Ver mi carrito</a></p>
  </main>

  <script type="module" src="/js/pedidos.js"></script>
</body>
</html>
