<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memoria 8 bits — Pixel Galletas</title>
  <meta name="description" content="Juega el mini juego de memoria 8 bits de Pixel Galletas: encuentra los 8 pares antes que nadie.">
  <meta name="theme-color" content="#15094F">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/fuentes.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/paginas-8bit.css">
</head>
<body class="pagina-8bit">
  <main class="retro-pagina">
    <a class="retro-volver" href="/">← Volver al inicio</a>
    <h1>Memoria 8 bits</h1>
    <p>Voltea dos cartas. Si son iguales, se quedan abiertas. Encuentra los 8 pares.</p>

    <section class="retro-caja" aria-labelledby="titulo-tablero">
      <h2 id="titulo-tablero">Tablero</h2>
      <div class="memoria-marcador">
        <span>Movimientos: <strong id="memoria-movimientos">0</strong></span>
        <button type="button" id="memoria-reiniciar" class="secundario">Nueva partida</button>
      </div>
      <div class="memoria-tablero" id="memoria-tablero"></div>
      <p class="memoria-estado" id="memoria-estado" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="/js/memoria.js"></script>
</body>
</html>
